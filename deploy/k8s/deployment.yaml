apiVersion: apps/v1
kind: Deployment
metadata:
  name: cuad-review
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cuad-review
  template:
    metadata:
      labels:
        app: cuad-review
    spec:
      containers:
        - name: service
          image: IMAGE   # replaced with the Cloud Run image digest by deploy/gke.sh
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
            limits:
              memory: 8Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            failureThreshold: 60
